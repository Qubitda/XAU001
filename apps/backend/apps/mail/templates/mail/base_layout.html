<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>{{ company_name }}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style type="text/css">
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body { margin: 0 !important; padding: 0 !important; width: 100% !important; background: #F3EEE6; }
    a { color: {{ primary_color }}; }
    @media screen and (max-width: 620px) {
      .container { width: 100% !important; }
      .px { padding-left: 20px !important; padding-right: 20px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#F3EEE6;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#F3EEE6;">
    <tr>
      <td align="center" style="padding:28px 12px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" class="container" style="width:600px;max-width:600px;background:#FBF8F3;border:1px solid #E9DCCB;">
          <!-- Header -->
          <tr>
            <td class="px" style="padding:28px 36px 18px 36px;border-bottom:1px solid #E9DCCB;">
              {% if logo_url %}
              <img src="{{ logo_url }}" alt="{{ company_name }}" width="140" style="display:block;max-width:140px;height:auto;" />
              {% else %}
              <div style="font-family:Georgia,'Times New Roman',serif;font-size:22px;letter-spacing:0.04em;color:{{ primary_color }};">
                {{ company_name }}
              </div>
              {% endif %}
            </td>
          </tr>
          <!-- Content -->
          <tr>
            <td class="px" style="padding:28px 36px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.6;color:#252321;">
              {{ content_html|safe }}
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td class="px" style="padding:20px 36px 28px 36px;border-top:1px solid #E9DCCB;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:1.55;color:#6E675F;">
              <div style="margin-bottom:8px;"><strong style="color:#252321;">{{ company_name }}</strong></div>
              <div>{{ company_address }}</div>
              <div>Destek: <a href="mailto:{{ support_email }}" style="color:{{ primary_color }};text-decoration:none;">{{ support_email }}</a></div>
              <div style="margin-top:14px;color:#9A9084;">
                Bu e-posta işlem bilgilendirmesi amaçlıdır. Lütfen yanıtlamayın.
                © {{ year }} {{ company_name }}. Tüm hakları saklıdır.
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
