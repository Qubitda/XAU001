<h1 style="margin:0 0 12px 0;font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:normal;color:#252321;">
  Siparişiniz alındı
</h1>
<p style="margin:0 0 14px 0;">
  Merhaba{% if customer_name %} {{ customer_name }}{% endif %}, siparişiniz sisteme kaydedildi.
</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 16px 0;background:#F3ECE1;border:1px solid #E9DCCB;">
  <tr>
    <td style="padding:14px 16px;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#252321;">
      <div style="margin-bottom:6px;"><strong>Sipariş no:</strong> {{ order_no }}</div>
      {% if amount %}<div style="margin-bottom:6px;"><strong>Tutar:</strong> {{ amount }} {{ currency|default:"TRY" }}</div>{% endif %}
      <div><strong>Tarih:</strong> {{ date }}</div>
    </td>
  </tr>
</table>
{% if order_url %}
<p style="margin:0;"><a href="{{ order_url }}" style="color:{{ primary_color }};">Sipariş detayına git →</a></p>
{% endif %}
